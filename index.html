<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>เกมทบทวนคณิต 🌈</title>
<style>
:root{--pink:#ff5fa2;--purple:#7c3aed;--blue:#22b8f0;--green:#22c55e;--yellow:#ffd23f;--orange:#ff8a1f;--red:#ff4d6d;--ink:#2e1f4f;--card:#fff;
 --r:24px;--shadow:0 10px 0 rgba(46,31,79,.18),0 18px 30px rgba(46,31,79,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Mali","Kodchasan","Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi",system-ui,sans-serif;color:var(--ink);
 background:#6d5dfc;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit}
/* ---------- animated background ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none;background:#6d5dfc}
.bg::before{content:"";position:absolute;inset:-60%;will-change:transform;
 background:conic-gradient(from 0deg at 50% 50%,#ff7ac6,#ffb347,#ffe66d,#5ee7a8,#4fc3ff,#8b7bff,#ff7ac6);
 animation:spin 40s linear infinite;opacity:.95}
.bg::after{content:"";position:absolute;inset:0;
 background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 85% 80%,rgba(255,255,255,.35),transparent 45%),
 radial-gradient(rgba(255,255,255,.22) 2px,transparent 2.5px) 0 0/26px 26px}
@keyframes spin{to{transform:rotate(360deg)}}
.sym{position:absolute;bottom:-60px;font-weight:900;color:#fff;opacity:.55;text-shadow:0 3px 0 rgba(46,31,79,.18);
 will-change:transform;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(18px,-55vh,0) rotate(180deg)}100%{transform:translate3d(-12px,-115vh,0) rotate(360deg)}}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px;position:relative}
/* ---------- mute button ---------- */
.mute{position:fixed;top:10px;right:10px;z-index:20;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#ffd23f;
 box-shadow:0 4px 0 #c99400,0 6px 12px rgba(0,0,0,.2);cursor:pointer;display:grid;place-items:center;padding:0}
.mute:active{transform:translateY(3px);box-shadow:0 1px 0 #c99400}
.mute svg{width:26px;height:26px}
.mute .off{display:none}.mute.muted .on{display:none}.mute.muted .off{display:block}.mute.muted{background:#e5e7eb;box-shadow:0 4px 0 #9ca3af}
/* ---------- menu ---------- */
.hero{text-align:center;padding:4px 50px 0;position:relative}
.hero .mascot{width:112px;height:112px;margin:0 auto -6px;display:block}
h1{font-size:1.75rem;margin:6px 0 2px;line-height:1.25}
.hero h1{font-size:1.6rem;white-space:nowrap}
.title{color:#fff;font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 #5b21b6,0 6px 0 rgba(46,31,79,.25);-webkit-text-stroke:1px rgba(91,33,182,.4)}
.title .g{display:inline-block;color:#ffe66d}
.sub{text-align:center;margin:4px auto 14px;font-size:.82rem!important;white-space:nowrap;max-width:100%;background:rgba(255,255,255,.92);display:table;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.95rem;box-shadow:0 4px 0 rgba(46,31,79,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.topic{--c1:#ff5fa2;--c2:#ff8fb8;--sh:#c2185b;position:relative;overflow:hidden;border:3px solid #fff;border-radius:26px;padding:12px 8px 10px;font-size:1.15rem;font-weight:800;color:#fff;cursor:pointer;
 background:linear-gradient(160deg,var(--c2),var(--c1))!important;box-shadow:0 8px 0 var(--sh),0 14px 18px rgba(46,31,79,.25);
 transition:transform .12s,box-shadow .12s;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.topic::after{content:"";position:absolute;left:10%;right:10%;top:6px;height:30%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.topic:active{transform:translateY(6px);box-shadow:0 2px 0 var(--sh),0 4px 8px rgba(46,31,79,.2)}
.topic .ico{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),0 3px 0 rgba(0,0,0,.15);margin-bottom:2px}
.topic .ico svg{width:44px;height:44px}
.topic small{font-weight:600;opacity:.97;font-size:.78rem;line-height:1.35;text-shadow:none}
.topic .best{font-size:.85rem;margin-top:auto;background:rgba(0,0,0,.16);border-radius:999px;padding:1px 10px;text-shadow:none;letter-spacing:1px}
.topic.mixed{grid-column:1/-1;min-height:96px;flex-direction:row;justify-content:center;gap:12px;text-align:left;
 background:linear-gradient(90deg,#ff5fa2,#a855f7,#22b8f0,#22c55e,#ffb020)!important;background-size:200% 100%!important;animation:rainbow 6s linear infinite}
.topic.mixed .txt{display:flex;flex-direction:column}
.topic.mixed .best{margin:0 0 0 auto;align-self:center}
@keyframes rainbow{to{background-position:200% 0}}
.t-graph{--c1:#ff3d8b;--c2:#ff8fc0;--sh:#b8105a}
.t-geo{--c1:#8b3dff;--c2:#b98bff;--sh:#5a1fb8}
.t-int{--c1:#0ea5e9;--c2:#5fd3ff;--sh:#0369a1}
.t-stat{--c1:#16b364;--c2:#6ee7a7;--sh:#0b7a43}
.t-exp{--c1:#ff7a00;--c2:#ffb557;--sh:#b45309}
.t-mixed{--sh:#6b21a8}
.opts{display:flex;justify-content:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.toggle{background:#fff;border:3px solid #fff;border-radius:999px;padding:9px 18px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 #c4b5fd}
.toggle:active{transform:translateY(3px);box-shadow:0 2px 0 #c4b5fd}
.toggle.on{background:#ffe66d;box-shadow:0 5px 0 #e0a800}
.foot{color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(46,31,79,.35)}
/* ---------- card ---------- */
.card{background:var(--card);border-radius:28px;padding:16px;box-shadow:var(--shadow);margin-top:10px;border:4px solid #fff;position:relative}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:6px;font-weight:800;padding-right:52px}
.pill{background:#fff;border-radius:999px;padding:7px 10px;box-shadow:0 4px 0 rgba(46,31,79,.2);font-size:.85rem;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;border:none}
#homeBtn{cursor:pointer;background:#ffe66d;box-shadow:0 4px 0 #d4a300}
#homeBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d4a300}
#hudTopic{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.pill svg{width:18px;height:18px;flex:none}
.streak{transition:transform .2s}
.streak .flame{transform-origin:50% 100%}
.streak.hot{background:linear-gradient(180deg,#ffd23f,#ff6a00);color:#fff;box-shadow:0 4px 0 #b43c00,0 0 14px rgba(255,120,0,.8);text-shadow:0 1px 0 rgba(0,0,0,.25)}
.streak.hot .flame{animation:flick .35s ease-in-out infinite alternate}
.streak.blaze{transform:scale(1.12)}
@keyframes flick{0%{transform:scale(1,1) rotate(-4deg)}100%{transform:scale(1.15,1.25) rotate(4deg)}}
/* ---------- map progress ---------- */
.map{position:relative;height:58px;margin:12px 4px 4px}
.road{position:absolute;left:14px;right:30px;top:30px;height:16px;border-radius:99px;background:#fff;box-shadow:0 4px 0 rgba(46,31,79,.2);overflow:hidden}
.road::before{content:"";position:absolute;left:6px;right:6px;top:7px;border-top:3px dashed #d8ccff}
.bar>div,#prog{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd23f,#ff8a1f,#ff4d8b);transition:width .45s cubic-bezier(.3,1.4,.5,1);border-radius:99px}
.mile{position:absolute;top:33px;width:10px;height:10px;border-radius:50%;background:#c4b5fd;border:2px solid #fff;transform:translateX(-50%)}
.mile.done{background:#ffd23f}
.goal{position:absolute;right:0;top:4px;width:40px;height:46px}
.pin{position:absolute;left:14px;top:-2px;width:40px;height:40px;transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.4,.5,1)}
.pin svg{width:40px;height:40px;animation:hop 1s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:10px;margin:-4px 0 6px}
.qhead .mascot{width:70px;height:70px;flex:none}
.bubble{position:relative;background:#f3edff;border:3px solid #ddd0ff;border-radius:18px;padding:6px 10px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#ddd0ff;border-left:0}
.bubble .say{font-weight:800;font-size:.95rem;line-height:1.4}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#qnum{font-weight:800;font-size:.8rem;background:#7c3aed;color:#fff;border-radius:99px;padding:2px 9px;opacity:1}
.qtype{display:inline-block;font-size:.8rem;background:#ffe66d;border-radius:99px;padding:2px 9px;font-weight:700}
.q{font-size:1.28rem;line-height:1.65;margin:6px 0 10px;font-weight:600}
.fig{display:flex;justify-content:center;margin:6px 0 10px;background:#fbfaff;border:2px dashed #e4dcff;border-radius:18px;padding:8px}
.fig svg{max-width:100%;height:auto}
.choices{display:grid;gap:12px}
.choice{position:relative;font-size:1.15rem;font-weight:700;padding:12px 14px 12px 58px;border-radius:20px;border:3px solid #e2d8ff;background:#fff;cursor:pointer;text-align:left;min-height:60px;color:var(--ink);
 box-shadow:0 6px 0 #cbbcff;transition:transform .08s,box-shadow .08s,background .15s;line-height:1.4}
.choice:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #cbbcff}
.choice .lt{position:absolute;left:10px;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.05rem;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.l0{background:#ff4d8b}.l1{background:#22b8f0}.l2{background:#ffb020}.l3{background:#22c55e}
.choice.correct{background:#dcfce7;border-color:#22c55e;box-shadow:0 6px 0 #16a34a;animation:glow 1s ease-in-out 2}
.choice.wrong{background:#ffe4e9;border-color:#ff4d6d;box-shadow:0 6px 0 #e11d48}
.choice.correct::after,.choice.wrong::after{position:absolute;right:12px;top:50%;margin-top:-15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.05rem}
.choice.correct::after{content:"✓";background:#22c55e}
.choice.wrong::after{content:"✗";background:#ff4d6d}
@keyframes glow{50%{transform:scale(1.03)}}
.choice:disabled{cursor:default}
.choice:disabled:not(.correct):not(.wrong){opacity:.6}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfrow .choice{text-align:center;font-size:1.45rem;font-weight:900;padding:16px 8px;min-height:78px}
.tfrow .choice[data-v="true"]{background:#ecfdf3;border-color:#86efac;box-shadow:0 6px 0 #4ade80}
.tfrow .choice[data-v="false"]{background:#fff1f3;border-color:#fda4af;box-shadow:0 6px 0 #fb7185}
.tfrow .choice.correct{background:#bbf7d0;border-color:#22c55e;box-shadow:0 6px 0 #16a34a}
.tfrow .choice.wrong{background:#fecdd3;border-color:#ff4d6d;box-shadow:0 6px 0 #e11d48}
.ansbox{font-size:1.9rem;font-weight:900;text-align:center;border:4px solid #c4b5fd;border-radius:18px;padding:8px;min-height:62px;background:#f8f5ff;letter-spacing:1px;box-shadow:inset 0 4px 0 rgba(124,58,237,.08)}
.ansbox.correct{background:#dcfce7;border-color:var(--green)}.ansbox.wrong{background:#ffe4e9;border-color:var(--red)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}
.key{font-size:1.5rem;font-weight:900;padding:11px 0;border-radius:16px;border:3px solid #fff;background:#e0f4ff;color:var(--ink);box-shadow:0 5px 0 #8fd3f5;cursor:pointer;transition:transform .07s,box-shadow .07s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #8fd3f5}
.key.ok{background:#22c55e;color:#fff;box-shadow:0 5px 0 #15803d;grid-column:span 2;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.key.del{background:#ffe66d;box-shadow:0 5px 0 #d4a300}
.key.neg{background:#ffc7e0;box-shadow:0 5px 0 #f472b6}
.fb{margin-top:14px;border-radius:20px;padding:12px 14px;font-size:1.03rem;line-height:1.6;display:none;position:relative}
.fb.show{display:block;animation:slideIn .3s ease-out}
.fb.good{background:#ecfdf3;border:3px solid #86efac}
.fb.bad{background:#fff1f3;border:3px solid #fda4af}
.fb b{font-size:1.15rem}
.fb.good>b:first-child{color:#15803d}.fb.bad>b:first-child{color:#e11d48}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.big{display:block;width:100%;font-size:1.25rem;font-weight:900;border:3px solid rgba(255,255,255,.7);border-radius:20px;padding:13px;margin-top:14px;color:#fff;background:linear-gradient(180deg,#9b6bff,#7c3aed);box-shadow:0 7px 0 #4c1d95,0 12px 16px rgba(46,31,79,.25);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #4c1d95}
.big.alt{background:linear-gradient(180deg,#ffa94d,#ff7a00);box-shadow:0 7px 0 #b45309,0 12px 16px rgba(46,31,79,.25)}
.big.alt:active{box-shadow:0 2px 0 #b45309}
.big.ghost{background:#fff;color:var(--purple);border:3px solid #ddd0ff;box-shadow:0 7px 0 #cbbcff;text-shadow:none}
.big.ghost:active{box-shadow:0 2px 0 #cbbcff}
#nextBtn{background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 7px 0 #166534,0 12px 16px rgba(46,31,79,.2)}
#nextBtn:active{box-shadow:0 2px 0 #166534}
/* ---------- result ---------- */
.res{padding-top:10px;overflow:hidden}
.rays{position:absolute;left:50%;top:92px;width:520px;height:520px;margin:-260px 0 0 -260px;pointer-events:none;opacity:.5;
 background:repeating-conic-gradient(#fff3b0 0 10deg,transparent 10deg 20deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%);animation:spin 18s linear infinite}
.trophy{width:132px;height:132px;display:block;margin:0 auto;position:relative;animation:trophyIn .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes trophyIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.stars{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 2px;position:relative;min-height:64px}
.stars svg{width:54px;height:54px;animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
.stars svg:nth-child(2){width:66px;height:66px;margin-bottom:8px}
.stars svg:nth-child(1){animation-delay:.35s}.stars svg:nth-child(2){animation-delay:.6s}.stars svg:nth-child(3){animation-delay:.85s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.badge{display:inline-flex;align-items:center;gap:8px;margin:6px auto 2px;padding:6px 16px 6px 8px;border-radius:999px;color:#fff;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.2);position:relative;animation:starIn .5s 1s both}
.badge svg{width:34px;height:34px}
.b3{background:linear-gradient(90deg,#f59e0b,#ef4444)}.b2{background:linear-gradient(90deg,#8b5cf6,#ec4899)}.b1{background:linear-gradient(90deg,#0ea5e9,#22c55e)}.b0{background:linear-gradient(90deg,#64748b,#8b5cf6)}
#resTitle{color:#7c3aed;position:relative;text-shadow:0 3px 0 #ede4ff}
.scorebig{font-size:1.4rem;margin:6px 0;font-weight:900;position:relative}
.res .small,#resWrong{position:relative}
.res .mascot{width:76px;height:76px;position:absolute;left:6px;top:10px}
.center{text-align:center}
.small{font-size:.9rem;opacity:.8}
.hidden{display:none!important}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.ovr{display:inline-block;position:relative;padding-top:.45em;line-height:1}
.ovr::before{content:attr(data-s);position:absolute;top:-.25em;left:0;right:0;text-align:center;font-size:.8em;letter-spacing:-1px}
sup{font-size:.7em}
.pop{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;animation:flash .5s ease-out}
.flash.good{background:radial-gradient(circle,rgba(134,239,172,.0) 40%,rgba(34,197,94,.35))}
.flash.bad{background:radial-gradient(circle,rgba(255,77,109,0) 40%,rgba(255,77,109,.4))}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* particles (class confetti kept for compatibility) */
.confetti{position:fixed;left:0;top:0;width:12px;height:12px;pointer-events:none;z-index:9;will-change:transform,opacity;border-radius:3px}
.confetti.burst{animation:burst 1s cubic-bezier(.15,.8,.35,1) forwards}
.confetti.rain{top:-20px;animation:fall 2s linear forwards}
.confetti.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);width:18px;height:18px;border-radius:0}
.confetti.dot{border-radius:50%}
@keyframes burst{0%{transform:translate3d(var(--x0),var(--y0),0) scale(.4) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate3d(calc(var(--x0) + var(--dx)),calc(var(--y0) + var(--dy)),0) scale(1) rotate(var(--rot));opacity:0}}
@keyframes fall{0%{transform:translate3d(var(--x0),0,0) rotate(0)}100%{transform:translate3d(calc(var(--x0) + var(--dx)),110vh,0) rotate(var(--rot));opacity:.7}}
.bigstar{position:fixed;left:50%;top:40%;width:120px;height:120px;margin:-60px 0 0 -60px;pointer-events:none;z-index:9;animation:bigstar .9s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bigstar{0%{transform:scale(0) rotate(-60deg);opacity:1}45%{transform:scale(1.1) rotate(8deg);opacity:1}100%{transform:scale(1.4) translateY(-60px);opacity:0}}
.ember{position:fixed;left:0;top:0;width:14px;height:20px;pointer-events:none;z-index:9;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff59d,#ffb300 45%,#ff5722 80%);
 will-change:transform,opacity;animation:ember 1.1s ease-out forwards}
@keyframes ember{0%{transform:translate3d(var(--x0),var(--y0),0) scale(1);opacity:1}100%{transform:translate3d(calc(var(--x0) + var(--dx)),calc(var(--y0) - 140px),0) scale(.2);opacity:0}}
.reviewlist{text-align:left;font-size:.95rem;line-height:1.5;padding-left:18px}
/* ---------- mascot expressions ---------- */
.mascot .e-happy,.mascot .e-sad{display:none}
.mascot.happy .e-neutral,.mascot.sad .e-neutral{display:none}
.mascot.happy .e-happy{display:inline}
.mascot.sad .e-sad{display:inline}
.mascot{overflow:visible}
.mascot .body{transform-origin:60px 110px;animation:breathe 2.4s ease-in-out infinite}
.mascot.happy .body{animation:jump .5s cubic-bezier(.3,1.5,.5,1) 2}
.mascot.sad .body{animation:droop .6s ease-out forwards}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-12px) scale(.95,1.06)}}
@keyframes droop{to{transform:translateY(3px) scale(1.04,.94) rotate(-4deg)}}
.mascot .blink{transform-origin:60px 58px;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media (max-width:360px){.topic{min-height:140px;font-size:1.05rem}.q{font-size:1.18rem}h1{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
 .sym,.bg::before{animation:none!important}
 .confetti,.ember,.bigstar{display:none!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">

<script>
"use strict";
/* ---------- helpers ---------- */
const M = "−"; // proper minus sign
const fr = (a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const line = s=>`<span class="ovr" data-s="⟷">${s}</span>`;
const seg  = s=>`<span class="ovr" data-s="—">${s}</span>`;
const ray  = s=>`<span class="ovr" data-s="⟶">${s}</span>`;
function svgWrap(w,h,inner){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">${inner}</svg>`;}

// coordinate plane -5..5 with points [{x,y,label,color}]
function plane(points, opts={}){
  const s=24, o=150, W=300;
  let g='';
  for(let i=-5;i<=5;i++){ g+=`<line x1="${o+i*s}" y1="${o-5*s}" x2="${o+i*s}" y2="${o+5*s}" stroke="#e5e7eb"/><line x1="${o-5*s}" y1="${o+i*s}" x2="${o+5*s}" y2="${o+i*s}" stroke="#e5e7eb"/>`;
    if(i!==0){g+=`<text x="${o+i*s}" y="${o+15}" font-size="10" text-anchor="middle" fill="#666">${i<0?M+(-i):i}</text><text x="${o-6}" y="${o-i*s+4}" font-size="10" text-anchor="end" fill="#666">${i<0?M+(-i):i}</text>`;}
  }
  g+=`<line x1="${o-5.6*s}" y1="${o}" x2="${o+5.6*s}" y2="${o}" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ax)" marker-start="url(#ax)"/>`;
  g+=`<line x1="${o}" y1="${o+5.6*s}" x2="${o}" y2="${o-5.6*s}" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ay)" marker-start="url(#ay)"/>`;
  g+=`<text x="${o+5.7*s}" y="${o-6}" font-size="16" fill="#16a34a" font-weight="bold">X</text><text x="${o+8}" y="${o-5.6*s+4}" font-size="16" fill="#2563eb" font-weight="bold">Y</text>`;
  if(opts.quads){ g+=`<text x="${o+2.5*s}" y="${o-3*s}" font-size="13" fill="#d97706" text-anchor="middle">จตุภาคที่ 1</text><text x="${o-2.5*s}" y="${o-3*s}" font-size="13" fill="#d97706" text-anchor="middle">จตุภาคที่ 2</text><text x="${o-2.5*s}" y="${o+3*s}" font-size="13" fill="#d97706" text-anchor="middle">จตุภาคที่ 3</text><text x="${o+2.5*s}" y="${o+3*s}" font-size="13" fill="#d97706" text-anchor="middle">จตุภาคที่ 4</text>`;}
  for(const p of points){ g+=`<circle cx="${o+p.x*s}" cy="${o-p.y*s}" r="6" fill="${p.color||'#ec4899'}" stroke="#fff" stroke-width="2"/>`; if(p.label) g+=`<text x="${o+p.x*s+8}" y="${o-p.y*s-8}" font-size="15" font-weight="bold" fill="${p.color||'#ec4899'}">${p.label}</text>`;}
  const defs=`<defs><marker id="ax" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#16a34a"/></marker><marker id="ay" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2563eb"/></marker></defs>`;
  return svgWrap(W,W,defs+g);
}
// line / segment / ray figures
function lineFig(kind){
  const defs=`<defs><marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c3aed"/></marker></defs>`;
  let g='';
  if(kind==='line') g=`<line x1="20" y1="45" x2="260" y2="45" stroke="#7c3aed" stroke-width="5" marker-start="url(#ar)" marker-end="url(#ar)"/><circle cx="90" cy="45" r="6" fill="#ec4899"/><circle cx="190" cy="45" r="6" fill="#ec4899"/><text x="84" y="28" font-size="18" font-weight="bold">A</text><text x="184" y="28" font-size="18" font-weight="bold">B</text>`;
  if(kind==='seg') g=`<line x1="60" y1="45" x2="220" y2="45" stroke="#7c3aed" stroke-width="5"/><circle cx="60" cy="45" r="8" fill="#ec4899"/><circle cx="220" cy="45" r="8" fill="#ec4899"/><text x="54" y="26" font-size="18" font-weight="bold">A</text><text x="214" y="26" font-size="18" font-weight="bold">B</text>`;
  if(kind==='ray') g=`<line x1="220" y1="45" x2="30" y2="45" stroke="#7c3aed" stroke-width="5" marker-end="url(#ar)"/><circle cx="220" cy="45" r="8" fill="#ec4899"/><circle cx="90" cy="45" r="6" fill="#ec4899"/><text x="84" y="26" font-size="18" font-weight="bold">A</text><text x="214" y="26" font-size="18" font-weight="bold">B</text>`;
  return svgWrap(280,70,defs+g);
}
// angle figure from the summary: A up, C right, E left, D down, B at 40° from OC
function angleFig(){
  const o=[150,140], L=110, rad=40*Math.PI/180;
  const bx=o[0]+L*Math.cos(rad), by=o[1]-L*Math.sin(rad);
  const defs=`<defs><marker id="aa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1d4ed8"/></marker></defs>`;
  let g=`<line x1="${o[0]}" y1="${o[1]}" x2="${o[0]}" y2="20" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aa)"/>
  <line x1="${o[0]}" y1="${o[1]}" x2="${o[0]}" y2="260" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aa)"/>
  <line x1="${o[0]}" y1="${o[1]}" x2="280" y2="${o[1]}" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aa)"/>

  <line x1="${o[0]}" y1="${o[1]}" x2="${bx}" y2="${by}" stroke="#db2777" stroke-width="3" marker-end="url(#aa)"/>
  <path d="M ${o[0]+45} ${o[1]} A 45 45 0 0 0 ${o[0]+45*Math.cos(rad)} ${o[1]-45*Math.sin(rad)}" fill="none" stroke="#db2777" stroke-width="2"/>
  <text x="${o[0]+50}" y="${o[1]-10}" font-size="15" fill="#db2777" font-weight="bold">40°</text>
  <rect x="${o[0]-14}" y="${o[1]-14}" width="14" height="14" fill="none" stroke="#1d4ed8"/>
  <text x="${o[0]+8}" y="22" font-size="18" font-weight="bold">A</text><text x="${bx+4}" y="${by-4}" font-size="18" font-weight="bold" fill="#db2777">B</text>
  <text x="270" y="${o[1]-8}" font-size="18" font-weight="bold">C</text><text x="18" y="${o[1]-8}" font-size="18" font-weight="bold">E</text>
  <text x="${o[0]+8}" y="262" font-size="18" font-weight="bold">D</text><text x="${o[0]-18}" y="${o[1]+20}" font-size="18" font-weight="bold">O</text>`;
  return svgWrap(300,275,defs+g);
}
function pictoFig(){
  const rows=[["ส้ม","🍊",4],["แอปเปิล","🍎",7],["กล้วย","🍌",5],["แตงโม","🍉",1]];

  return svgWrap(310,200,g);

function barFig(){
  const data=[["แอปเปิล",[800,600,40]],["ส้ม",[600,700,90]],["กล้วย",[50,550,150]]];
  const cols=["#4f81bd","#c0504d","#9bbb59"], H=180, base=200, sc=H/900;
  let g='';
  for(let v=0;v<=900;v+=300){const y=base-v*sc; g+=`<line x1="40" y1="${y}" x2="300" y2="${y}" stroke="#e5e7eb"/><text x="35" y="${y+4}" font-size="10" text-anchor="end">${v}</text>`;}
  data.forEach((d,i)=>{const x0=55+i*85; d[1].forEach((v,j)=>{g+=`<rect x="${x0+j*20}" y="${base-v*sc}" width="18" height="${v*sc}" fill="${cols[j]}"/>`;}); g+=`<text x="${x0+29}" y="${base+16}" font-size="13" text-anchor="middle">${d[0]}</text>`;});
  ["2013","2014","2015"].forEach((t,j)=>{g+=`<rect x="${90+j*65}" y="230" width="12" height="12" fill="${cols[j]}"/><text x="${106+j*65}" y="241" font-size="12">${t}</text>`;});
  return svgWrap(310,250,g);
}
function pieFig(){
  const data=[["กาแฟ",38,"#70ad47"],["ชา",36,"#4472c4"],["โดนัท",11,"#ffc000"],["ขนมอบ",10,"#c5e0b4"],["น้ำผลไม้",5,"#b4c7e7"]];
  const cx=100,cy=105,r=85; let a=-Math.PI/2, g=`<text x="150" y="16" font-size="14" text-anchor="middle" font-weight="bold">ยอดขายช่วงเช้า (ทั้งหมด 100 คน)</text>`;
  data.forEach(d=>{const b=a+d[1]/100*2*Math.PI; const large=(b-a)>Math.PI?1:0;
    g+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${large} 1 ${cx+r*Math.cos(b)},${cy+r*Math.sin(b)} Z" fill="${d[2]}" stroke="#fff" stroke-width="2"/>`;
    const m=(a+b)/2; g+=`<text x="${cx+r*.62*Math.cos(m)}" y="${cy+r*.62*Math.sin(m)+4}" font-size="11" text-anchor="middle" font-weight="bold">${d[1]}%</text>`; a=b;});
  data.forEach((d,i)=>{g+=`<rect x="200" y="${45+i*24}" width="14" height="14" fill="${d[2]}"/><text x="220" y="${57+i*24}" font-size="13">${d[0]}</text>`;});
  return svgWrap(310,200,g);
}
function tableFig(rows){
  let h='<table style="border-collapse:separate;border-spacing:3px;font-size:.95rem;margin:auto">';
  rows.forEach((r,i)=>{h+='<tr>'+r.map((c,j)=>`<td style="padding:5px 7px;border-radius:10px;text-align:center;background:${j===0?(i===0?'#fbcfe8':'#bbf7d0'):'#f5f3ff'};font-weight:${j===0?700:400}">${c}</td>`).join('')+'</tr>';});
  return h+'</table>';
}

/* sound: WebAudio, generated tones only */
const SND={ctx:null, muted: store('mrg_mute')==='1'};
function actx(){ if(SND.muted) return null; try{ if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; SND.ctx=new C();} if(SND.ctx.state==='suspended') SND.ctx.resume(); }catch(e){return null;} return SND.ctx; }
function tone(f, t0, dur, type='sine', vol=.18, f2){ const c=actx(); if(!c) return; const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02); }
const sfx={
 tap(){ tone(660,0,.06,'triangle',.08); },
 good(){ [523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.18,'triangle',.16)); },
 bad(){ tone(220,0,.22,'sawtooth',.08,140); tone(180,.12,.28,'square',.05,110); },
 fire(){ tone(300,0,.35,'sawtooth',.05,1200); tone(900,.15,.25,'triangle',.08,1500); },
 win(){ [523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.24,'triangle',.16)); tone(1568,.75,.5,'sine',.1); },
 lose(){ [392,349,330].forEach((f,i)=>tone(f,i*.16,.25,'triangle',.12)); }
};
function syncMute(){ $('muteBtn').classList.toggle('muted',SND.muted); }

/* particles: capped counts, transform/opacity only */
const COLORS=['#ff4d8b','#ffd23f','#22c55e','#22b8f0','#a855f7','#ff8a1f'];
function burst(x,y,n=22){ if(RM.matches) return; n=Math.min(n,28);
  for(let i=0;i<n;i++){ const s=document.createElement('div'); s.className='confetti burst '+(i%3===0?'star':i%3===1?'dot':'');
    const a=Math.random()*Math.PI*2, r=70+Math.random()*110;
    s.style.cssText=`--x0:${x-6}px;--y0:${y-6}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-40}px;--rot:${(Math.random()*720-360)|0}deg;background:${COLORS[i%COLORS.length]}`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),1100); } }
function confetti(){ if(RM.matches) return; const W=window.innerWidth;
  for(let i=0;i<30;i++){ const s=document.createElement('div'); s.className='confetti rain '+(i%3===0?'star':i%3===1?'dot':'');
    s.style.cssText=`--x0:${Math.random()*W}px;--dx:${(Math.random()*80-40)|0}px;--rot:${(Math.random()*900)|0}deg;background:${COLORS[i%COLORS.length]};animation-delay:${(Math.random()*.6).toFixed(2)}s`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),2800);} }
function bigStar(){ if(RM.matches) return; const d=document.createElement('div'); d.className='bigstar'; d.innerHTML=STAR(true); document.body.appendChild(d); setTimeout(()=>d.remove(),950); }
function flames(el){ if(RM.matches||!el) return; const r=el.getBoundingClientRect();
  for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='ember';
    s.style.cssText=`--x0:${r.left+r.width/2-7+(Math.random()*40-20)}px;--y0:${r.top}px;--dx:${(Math.random()*60-30)|0}px;animation-delay:${(i*0.04).toFixed(2)}s`;
    document.body.appendChild(s); setTimeout(()=>s.remove(),1400);} }
function flash(kind){ const f=document.createElement('div'); f.className='flash '+kind; document.body.appendChild(f); setTimeout(()=>f.remove(),550); }
function streakFx(){ const p=$('hudStreakPill'); p.classList.toggle('hot',S.streak>=3); p.classList.toggle('blaze',S.streak>=5); }
function mapFx(){ const n=S.list.length||1, f=Math.min(1,S.i/n); $('pin').style.left=`calc(14px + (100% - 44px) * ${f})`;
  const ms=$('miles'); if(ms.dataset.n!=String(n)){ ms.dataset.n=n; ms.innerHTML=''; const k=Math.min(n-1,9); for(let j=1;j<=k;j++){const d=document.createElement('span'); d.className='mile'; d.dataset.f=j/(k+1); d.style.left=`calc(14px + (100% - 44px) * ${j/(k+1)})`; ms.appendChild(d);} }
  ms.querySelectorAll('.mile').forEach(d=>d.classList.toggle('done',+d.dataset.f<=f)); }
const SAY={idle:['สู้ ๆ นะ! คิดดี ๆ ก่อนตอบ','ข้อนี้ทำได้แน่นอน!','ค่อย ๆ อ่านโจทย์นะ','เราเป็นกำลังใจให้! 💪','ลุยเลย นักคณิตตัวจิ๋ว!'],
 good:['เย้! ถูกต้อง!','เก่งสุด ๆ ไปเลย!','ว้าว! ไฟลุกแล้ว!'], bad:['ไม่เป็นไรนะ อ่านเฉลยก่อน','เกือบแล้ว! ข้อหน้าเอาใหม่']};
const pick=a=>a[Math.floor(Math.random()*a.length)];

function buildMenu(){
  const g=$('topicGrid'); g.innerHTML='';
  [...TOPICS, MIXED].forEach(t=>{
    const b=document.createElement('button'); b.className='topic t-'+t.id+(t.id==='mixed'?' mixed':''); b.dataset.topic=t.id;
    const best=+(store('mrg_best_'+t.id)||0);
    const n = t.id==='mixed' ? 'สุ่ม 20 ข้อจากทุกเรื่อง' : `${t.desc} • ${t.qs.length} ข้อ`;
    const stars=`<span class="best">${best?'⭐'.repeat(best)+'☆'.repeat(3-best):'☆☆☆'}</span>`;
    b.innerHTML = t.id==='mixed'
      ? `<span class="ico">${ICONS.mixed}</span><span class="txt">${t.name}<small>${n}</small></span>${stars}`
      : `<span class="ico">${ICONS[t.id]||''}</span>${t.name}<small>${n}</small>${stars}`;
    b.onclick=()=>{sfx.tap(); startTopic(t.id);};
    g.appendChild(b);
  });
}
function prep(q, topicId){ // prepare a playable copy with shuffled choices
  const c={...q, topicId};
  if(q.t==='mc'){ const idx=shuffle(q.choices.map((_,i)=>i)); c.choices=idx.map(i=>q.choices[i]); c.a=idx.indexOf(q.a); }
  return c;
}
function startTopic(id, list){
  S.topic=id; S.mode=list?'retry':'normal'; if(!list) S.lastTopic=id;
  if(list){ S.list=shuffle(list).map(q=>prep(q.src,q.topicId)); }
  else if(id==='mixed'){ const all=[]; TOPICS.forEach(t=>t.qs.forEach(q=>all.push({q,tid:t.id}))); S.list=shuffle(all).slice(0,20).map(o=>prep(o.q,o.tid)); }
  else { const t=TOPICS.find(t=>t.id===id); S.list=shuffle(t.qs).map(q=>prep(q,id)); }
  S.i=0; S.score=0; S.streak=0; S.best=0; S.wrong=[];
  const tn = id==='mixed'?MIXED:TOPICS.find(t=>t.id===id);
  $('hudTopic').textContent=tn.emo+' '+tn.name+(S.mode==='retry'?' (ฝึกซ้ำ)':'');
  show('game');
  if(S.timerOn){ S.t0=Date.now(); $('hudTimerWrap').classList.remove('hidden'); clearInterval(S.tick); S.tick=setInterval(()=>{$('hudTimer').textContent=fmtT(Date.now()-S.t0);},500);} else $('hudTimerWrap').classList.add('hidden');
  render();
}
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function show(id){['menu','game','result'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); window.scrollTo(0,0);}
function hud(){ $('hudScore').textContent=S.score; $('hudStreak').textContent=S.streak; $('prog').style.width=(S.i/S.list.length*100)+'%'; mapFx(); streakFx(); }

function render(){
  const q=S.list[S.i]; S.answered=false; S.input='';
  hud();
  $('qnum').textContent=`ข้อ ${S.i+1} / ${S.list.length}`;
  $('qtype').textContent={mc:'🔘 เลือกตอบ',tf:'✅❌ ถูกหรือผิด',num:'🔢 เติมตัวเลข'}[q.t];
  $('qtext').innerHTML=q.q;
  $('qfig').innerHTML=q.fig?q.fig():''; $('qfig').classList.toggle('hidden',!q.fig);
  $('fb').className='fb'; $('fb').innerHTML=''; $('nextBtn').classList.add('hidden');
  setMood('gameMascot','neutral'); $('say').textContent = S.streak>=3 ? `ไฟลุก! ติดกัน ${S.streak} ข้อแล้ว 🔥` : pick(SAY.idle);
  const box=$('qinput'); box.innerHTML='';
  if(q.t==='mc'){
    const d=document.createElement('div'); d.className='choices';
    q.choices.forEach((c,k)=>{const b=document.createElement('button'); b.className='choice'; b.dataset.k=k; b.innerHTML=`<span class="lt l${k}">${'ABCD'[k]}</span>`+c; b.onclick=()=>answer(k,b); d.appendChild(b);});
    box.appendChild(d);
  } else if(q.t==='tf'){
    const d=document.createElement('div'); d.className='tfrow';
    [[true,'⭕ ถูก'],[false,'❌ ผิด']].forEach(([v,l])=>{const b=document.createElement('button'); b.className='choice'; b.dataset.v=v; b.innerHTML=l; b.onclick=()=>answer(v,b); d.appendChild(b);});
    box.appendChild(d);
  } else {
    box.innerHTML=`<div class="ansbox" id="ansbox">&nbsp;</div><div class="pad" id="pad"></div>`;
    const keys=['7','8','9','⌫','4','5','6',M,'1','2','3','.','0','ok'];
    keys.forEach(k=>{const b=document.createElement('button'); b.className='key'+(k==='ok'?' ok':k==='⌫'?' del':k===M?' neg':''); b.textContent=k==='ok'?'ตอบ ✔':k; b.dataset.key=k; b.onclick=()=>keyPress(k); $('pad').appendChild(b);});
  }
  const card=$('qcard'); card.classList.remove('pop','shake'); void card.offsetWidth; card.classList.add('pop');
}
function keyPress(k){
  if(S.answered) return;
  if(k==='ok'){ if(S.input===''||S.input===M) return; answer(parseNum(S.input)); return; }
  sfx.tap();
  if(k==='⌫') S.input=S.input.slice(0,-1);
  else if(k===M){ S.input = S.input.startsWith(M)?S.input.slice(1):M+S.input; }
  else if(k==='.'){ if(!S.input.includes('.')) S.input+=(S.input===''||S.input===M?'0.':'.'); }
  else if(S.input.replace(M,'').length<12) S.input+=k;
  $('ansbox').innerHTML=S.input||'&nbsp;';
}
function parseNum(s){ return parseFloat(s.replace(M,'-').replace(/,/g,'')); }
document.addEventListener('keydown',e=>{
  if($('game').classList.contains('hidden')) return;
  const q=S.list[S.i]; if(!q) return;
  if(S.answered && e.key==='Enter'){ next(); return; }
  if(q.t!=='num') return;
  if(/^[0-9]$/.test(e.key)) keyPress(e.key);
  else if(e.key==='-') keyPress(M);
  else if(e.key==='.') keyPress('.');
  else if(e.key==='Backspace') keyPress('⌫');
  else if(e.key==='Enter') keyPress('ok');
});
function fmtAns(q){
  if(q.t==='mc') return q.choices[q.a];
  if(q.t==='tf') return q.a?'ถูก':'ผิด';
  const n=q.a; return (n<0?M:'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:6});
}
function answer(v, btn){
  if(S.answered) return; S.answered=true;
  const q=S.list[S.i]; let ok;
  if(q.t==='num') ok=Math.abs(v-q.a)<1e-9;
  else ok=(v===q.a);
  // visual marks
  if(q.t==='mc'){ document.querySelectorAll('.choice').forEach(b=>{b.disabled=true; if(+b.dataset.k===q.a) b.classList.add('correct');}); if(!ok&&btn) btn.classList.add('wrong'); }
  if(q.t==='tf'){ document.querySelectorAll('.choice').forEach(b=>{b.disabled=true; if((b.dataset.v==='true')===q.a) b.classList.add('correct');}); if(!ok&&btn) btn.classList.add('wrong'); }
  if(q.t==='num'){ $('ansbox').classList.add(ok?'correct':'wrong'); }
  const fb=$('fb');
  const src = btn || $('ansbox'); const r = src ? src.getBoundingClientRect() : {left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  if(ok){ S.score++; S.streak++; S.best=Math.max(S.best,S.streak);
    const cheers=['เก่งมาก! 🎉','ถูกต้อง! 🌟','สุดยอด! 🚀','เยี่ยมเลย! 💖','ใช่แล้ว! 🥳'];
    fb.className='fb show good'; fb.innerHTML=`<b>${cheers[Math.floor(Math.random()*cheers.length)]}</b>${S.streak>=3?` 🔥 ตอบถูกติดกัน ${S.streak} ข้อ!`:''}<br>${q.ex}`;
    setMood('gameMascot','happy'); $('say').textContent = S.streak>=3 ? `ไฟลุก! 🔥 ติดกัน ${S.streak} ข้อ!` : pick(SAY.good);
    burst(r.left+r.width/2, r.top+r.height/2, 22); bigStar(); flash('good'); sfx.good();
    if(S.streak>=3){ setTimeout(()=>{flames($('hudStreakPill')); sfx.fire();}, 120); }
    if(S.streak%5===0) confetti();
  } else { S.streak=0; S.wrong.push({src:originalOf(q), topicId:q.topicId});
    fb.className='fb show bad'; fb.innerHTML=`<b>ยังไม่ถูกนะ ลองใหม่รอบหน้า 💪</b><br>คำตอบที่ถูก: <b>${fmtAns(q)}</b><br>${q.ex}`;
    $('qcard').classList.remove('shake','pop'); void $('qcard').offsetWidth; $('qcard').classList.add('shake');
    setMood('gameMascot','sad'); $('say').textContent=pick(SAY.bad); flash('bad'); sfx.bad();
    if(navigator.vibrate && !RM.matches) try{navigator.vibrate(80);}catch(e){}
  }
  hud(); $('nextBtn').classList.remove('hidden'); $('nextBtn').textContent = S.i+1<S.list.length?'ข้อต่อไป ➜':'ดูผลคะแนน 🏆';
  $('nextBtn').scrollIntoView({behavior:RM.matches?'auto':'smooth',block:'nearest'});
}
function originalOf(q){ // find the unshuffled original object
  for(const t of TOPICS) for(const o of t.qs) if(o.q===q.q && o.ex===q.ex) return o;
  return q;
}
function next(){ S.i++; if(S.i<S.list.length) render(); else finish(); }
function finish(){
  clearInterval(S.tick); $('prog').style.width='100%';
  const n=S.list.length, pct=S.score/n, stars = pct>=0.9?3:pct>=0.7?2:pct>=0.4?1:0;
  $('resStars').innerHTML=[0,1,2].map(i=>STAR(i<stars)).join('');
  $('resStars').setAttribute('aria-label','⭐'.repeat(stars)+'☆'.repeat(3-stars));
  $('resBadge').innerHTML=`<span class="badge ${BADGES[stars][0]}">${MEDAL}${BADGES[stars][1]}</span>`;
  $('resTitle').textContent= stars===3?'สุดยอดไปเลย! 🏆':stars===2?'เก่งมาก! 🎉':stars===1?'ดีแล้ว สู้ต่อนะ! 💪':'ไม่เป็นไร ลองอีกครั้งนะ 🌱';
  $('resScore').textContent=`ได้ ${S.score} / ${n} คะแนน`;
  $('resExtra').textContent=`🔥 ตอบถูกติดกันสูงสุด ${S.best} ข้อ`+(S.timerOn?` • ⏱️ ใช้เวลา ${fmtT(Date.now()-S.t0)}`:'');
  if(S.mode==='normal'){ const k='mrg_best_'+S.topic; if(stars>+(store(k)||0)) store(k,String(stars)); }
  $('resWrong').innerHTML = S.wrong.length?`<p class="small">ข้อที่ยังผิด ${S.wrong.length} ข้อ — กดปุ่มด้านล่างเพื่อฝึกอีกรอบ</p>`:'<p>ตอบถูกครบทุกข้อเลย! 🌈</p>';
  $('retryWrongBtn').classList.toggle('hidden', S.wrong.length===0);
  setMood('resMascot', stars>=1?'happy':'sad');
  show('result'); if(stars>=2) confetti();
  if(stars>=1) sfx.win(); else sfx.lose();
}

$('nextBtn').onclick=()=>{sfx.tap(); next();};
$('homeBtn').onclick=()=>{sfx.tap(); clearInterval(S.tick); buildMenu(); show('menu');};
$('menuBtn').onclick=()=>{sfx.tap(); buildMenu(); show('menu');};
$('againBtn').onclick=()=>{sfx.tap(); startTopic(S.lastTopic);};
$('retryWrongBtn').onclick=()=>{ sfx.tap(); const w=S.wrong.slice(); startTopic(S.lastTopic, w); };

$('muteBtn').onclick=()=>{ SND.muted=!SND.muted; store('mrg_mute',SND.muted?'1':'0'); syncMute(); if(!SND.muted) sfx.tap(); };
['menuMascot','gameMascot','resMascot'].forEach(id=>{ $(id).innerHTML=MASCOT; });
syncMute();
buildMenu();
// test hook
window.__game={TOPICS,S,current:()=>S.list[S.i]};
</script>
